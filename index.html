<style>
:root{--bg:#0b0b0c;--card:#151517;--ink:#f1ede4;--mut:#9a9aa0;--line:#2c2c30;--acc:#d4af37;--gold:#d4af37;--ok:#b8913a}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;color:var(--gold)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--ink);color:var(--bg)}
button.p{background:var(--acc);color:#0b0b0c}button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}button.ok{background:var(--ok);color:#0b0b0c}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 10px}
nav{position:sticky;top:0;z-index:5;background:#000;color:var(--ink);border-bottom:1px solid var(--gold);display:flex;gap:6px;padding:10px 12px;align-items:center;overflow-x:auto;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{margin-right:auto;display:flex;align-items:center;gap:8px;font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:700;color:var(--gold);white-space:nowrap}.brand img{height:34px}nav button{background:transparent;color:inherit;opacity:.75;white-space:nowrap}nav button.on{background:var(--gold);color:#14201c;opacity:1}
.bd{background:var(--acc);color:#0b0b0c;border-radius:99px;padding:1px 7px;font-size:12px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.mut{color:var(--mut);font-size:14px}.pr{font-weight:800;font-size:18px}.old{text-decoration:line-through;color:var(--mut);font-size:13px;margin-right:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}.chips button.on{background:var(--acc);color:#0b0b0c;border-color:var(--acc)}
.kan{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}.col{min-width:235px;flex:1;background:var(--line);border-radius:14px;padding:8px;min-height:140px}.col h3{margin:4px 6px 8px;font-size:14px}
.o{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px;border-left:4px solid var(--gold)}
.tl div{padding:6px 0 6px 26px;position:relative;color:var(--mut)}.tl div:before{content:"";position:absolute;left:4px;top:11px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}.tl .d{color:var(--ink)}.tl .d:before{background:var(--ok);border-color:var(--ok)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal>div{background:var(--card);width:min(480px,100%);border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
.tg{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--line)}.narrow{max-width:440px;margin:0 auto}.narrow button.w{width:100%;padding:15px;margin-top:8px}
button:disabled{opacity:.4;cursor:not-allowed}.bar{display:grid;grid-template-columns:110px 1fr 80px;gap:8px;align-items:center;margin:5px 0;font-size:13px}.bar i{display:block;height:12px;background:var(--gold);border-radius:6px;min-width:2px}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leaflet-container{background:#222}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;display:none;max-width:90vw}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== CONFIGURE AQUI (Supabase > Project Settings > API). Use só a chave anon/publishable. ====== */
const SUPABASE_URL=window.SB_URL||'COLE_A_PROJECT_URL_AQUI', SUPABASE_KEY=window.SB_KEY||'COLE_A_CHAVE_ANON_AQUI';
/* ================================================================================================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VAPID=window.VAPID_PUBLIC||'';
const fdt=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const ldt=ms=>{const d=new Date(ms-new Date().getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
const R=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),$=s=>document.querySelector(s);
const ST=['novo','confirmado','preparo','pronto','entrega','entregue','cancelado'];
const LB={novo:'Novos',confirmado:'Confirmados',preparo:'Em preparação',pronto:'Prontos',entrega:'Em entrega',entregue:'Entregues',cancelado:'Cancelados'};
const ERR={login_required:'Faça login para continuar.',empty_cart:'Carrinho vazio.',product_unavailable:'Um item ficou indisponível.',invalid_coupon:'Cupom inválido ou expirado.',forbidden:'Você não tem permissão para isso.',already_taken:'Outro entregador já pegou este pedido.',driver_not_online:'Fique online para aceitar entregas.',no_active_delivery:'Sem entrega ativa.',order_closed:'Pedido já encerrado.',too_many_open_orders:'Você já tem 3 pedidos em andamento. Aguarde a conclusão de um deles.',rate_limited:'Muitos pedidos em pouco tempo. Tente novamente mais tarde.',cannot_demote_self:'Você não pode remover seu próprio acesso de admin.',invalid_schedule:'Escolha um horário entre 30 minutos e 7 dias a partir de agora.',not_enough_points:'Você ainda não tem pontos suficientes.',invalid_blocks:'Quantidade de resgate inválida.',out_of_stock:'Um item acabou de esgotar. Atualize o cardápio.',nothing_to_pay:'Não há entregas a pagar para este entregador.',cannot_change_during_delivery:'Termine a entrega antes de ficar offline.'};
const S={per:'30',cfg:{},me:null,tab:null,cat:'Todos',cart:[],orders:[],prods:[],modal:null,track:null,loc:null,drv:null,rep:null,lastLoc:null,gps:''};
const staff=()=>['admin','gerente','atendente'].includes(S.me.role),mgr=()=>['admin','gerente'].includes(S.me.role);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}}
if(SUPABASE_URL.startsWith('COLE')){document.body.innerHTML='<main><div class="card"><h2>Falta configurar</h2><p>Abra este arquivo em um editor de texto e preencha <b>SB_URL</b> e <b>SB_KEY</b> no arquivo <b>config.js</b> (Supabase &gt; Project Settings &gt; API). Use somente a chave anon/publishable.</p></div></main>';throw 0}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function rpc(n,a){const{data,error}=await sb.rpc(n,a);if(error){toast(ERR[error.message]||error.message);return{error}}return{data}}
const PAY={pix:'PIX',credito:'Crédito',debito:'Débito',dinheiro:'Dinheiro'};
const tabsFor=r=>r=='cliente'?[['menu','Cardápio'],['cart','Carrinho'],['my','Meus pedidos']]:r=='cozinha'?[['kit','Cozinha']]:r=='entregador'?[['drv','Entregas']]:[['kan','Pedidos'],['kit','Cozinha'],['map','Mapa'],['menu','Cardápio'],['cli','Clientes']].concat(['admin','gerente'].includes(r)?[['rep','Relatórios'],['pro','Promoções'],['pay','Repasse']]:[]).concat(r=='admin'?[['usr','Usuários']]:[]);

/* ---------- dados ---------- */
async function loadMenu(){const{data}=await sb.from('products').select('*,categories(name),product_addons(id,name,price,active)').eq('active',true).order('name');S.prods=data||[]}
async function loadOrders(){const{data}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(80);S.orders=data||[]}
async function loadDrv(){if(S.me.role!='entregador')return;const{data}=await sb.from('drivers').select('*').eq('id',S.me.id).maybeSingle();S.drv=data;const e=await sb.rpc('my_earnings');S.earn=e.data}
async function loadCfg(){const{data}=await sb.from('settings').select('*');const c={};(data||[]).forEach(r=>c[r.key]=r.value);S.cfg={rest:c.restaurant_lat!=null?[Number(c.restaurant_lat),Number(c.restaurant_lng)]:null,fee:Number(c.driver_fee??5),le:Number(c.loyalty_earn??1),lb:Number(c.loyalty_block??100),lv:Number(c.loyalty_value??5)}}
async function boot(){const{data:{session}}=await sb.auth.getSession();
 if(!session){S.me=null;sb.removeAllChannels();return render()}
 if(S.me&&S.me.id==session.user.id)return;
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(!p){toast('Perfil não encontrado. Peça ao administrador para criar seu perfil.');await sb.auth.signOut();S.me=null;render();return}
 if(p.active===false){toast('Conta desativada. Fale com o restaurante.');await sb.auth.signOut();return}
 S.me=p;S.tab=tabsFor(p.role)[0][0];await Promise.all([loadMenu(),loadOrders(),loadDrv(),loadCfg()]);listen();resumeGps();if(p.role=='cliente')loadMy();render()}
sb.auth.onAuthStateChange(ev=>{if(['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev))setTimeout(boot,0)});
function listen(){sb.removeAllChannels();
 sb.channel('orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},async pl=>{if(pl.eventType=='INSERT'&&staff()){beep();toast('Novo pedido recebido!')}await loadOrders();await loadDrv();if(S.tab!='cart')render()}).subscribe();
 sb.channel('notif').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.me.id},pl=>toast(pl.new.body)).subscribe();
 if(staff())sb.channel('drv').on('postgres_changes',{event:'*',schema:'public',table:'drivers'},()=>{if(S.tab=='map')loadMap()}).subscribe()}
async function openTrack(id){if(S.me.role=='cliente')loadMy();S.track=id;S.tab='track';S.mv=null;S.lastLoc=null;sb.channel('loc').unsubscribe();
 const{data}=await sb.from('driver_locations').select('*').eq('order_id',id).order('recorded_at',{ascending:false}).limit(1);S.lastLoc=data&&data[0]||null;
 sb.channel('loc'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'driver_locations',filter:'order_id=eq.'+id},pl=>{S.lastLoc=pl.new;if(S.tab=='track')render()}).subscribe();render()}

/* ---------- GPS do entregador ---------- */
let wid=null,lastPush=0;
function gpsOn(oid){if(wid!=null)return;if(!navigator.geolocation){S.gps='GPS indisponível neste aparelho';return}
 wid=navigator.geolocation.watchPosition(p=>{S.gps='GPS ativo';if(Date.now()-lastPush<8000)return;lastPush=Date.now();
  sb.rpc('push_location',{p_order:oid,p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_heading:p.coords.heading}).then(({error})=>{S.gps=error?'Falha ao enviar localização (conexão?)':'GPS ativo'})},
  ()=>{S.gps='GPS desativado: permita a localização no navegador';render()},{enableHighAccuracy:true})}
function gpsOff(){if(wid!=null)navigator.geolocation.clearWatch(wid);wid=null;S.gps=''}
function resumeGps(){const o=S.orders.find(o=>o.driver_id==S.me.id&&o.status=='entrega');if(S.me.role=='entregador'&&o)gpsOn(o.id)}

/* ---------- ações ---------- */
async function st(id,s){const{error}=await rpc('set_order_status',{p_order:id,p_status:s});if(error)return;if(s=='entrega')gpsOn(id);if(s=='entregue'||s=='cancelado')gpsOff();await loadOrders();render()}
async function signIn(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)toast('Não foi possível entrar: '+error.message)}
async function signUp(){const{data,error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{data:{name:$('#nm').value,phone:$('#ph').value,wa_opt_in:$('#wa').checked}}});if(error)return toast(error.message);if(!data.session)toast('Conta criada. Confirme o e-mail para entrar.')}
async function signOut(){gpsOff();S.me=null;S.cart=[];await sb.auth.signOut();render()}
async function place(){const a=$('#ca').value.trim();if(!a)return toast('Informe o endereço de entrega.');const sched=$('#sw')&&$('#sw').value=='1';let when=null;if(sched){const v=$('#st').value;if(!v)return toast('Escolha o horário do agendamento.');when=new Date(v).toISOString()}const m=$('#cpay').value,tr=$('#ctr')&&$('#ctr').value;
 const{data,error}=await rpc(sched?'place_order_scheduled':'place_order',{p_items:S.cart.map(i=>({product_id:i.pid,qty:i.q,addons:i.aid,obs:i.obs})),p_address:{text:a,lat:S.loc&&S.loc[0],lng:S.loc&&S.loc[1]},p_method:m,p_change_for:m=='dinheiro'&&tr?Number(tr):null,p_coupon:$('#cp').value.trim()||null,p_notes:null,...(sched?{p_when:when}:{})});
 if(error)return;S.cart=[];await loadOrders();toast('Pedido realizado com sucesso!');openTrack(data)}
async function designar(id){const{data,error}=await rpc('suggest_driver',{p_order:id});if(error)return;if(!data.length)return toast('Nenhum entregador online no momento.');
 const d=data[0];if(confirm('Recomendado: '+d.name+' — '+d.km_to_restaurant+' km do restaurante. Designar?')){await rpc('assign_driver',{p_order:id,p_driver:d.driver_id});await loadOrders();render()}}
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180;return 6371*2*Math.asin(Math.sqrt(Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2))};

function menu(){const cats=['Todos',...new Set(S.prods.map(p=>p.categories&&p.categories.name).filter(Boolean))],l=S.prods.filter(p=>S.cat=='Todos'||(p.categories&&p.categories.name)==S.cat);
 return `<div class="chips">${cats.map(c=>`<button class="${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>${l.length?`<div class="grid">${l.map(p=>`<div class="card"><b>${p.name}</b>${p.available?'':' <span class="tg">Indisponível</span>'}<div class="mut">${p.description||''}</div>${stockBox(p)}<div class="row"><div>${p.promo_price?`<span class="old">${R(p.price)}</span>`:''}<span class="pr">${R(p.promo_price||p.price)}</span></div>${S.me.role=='cliente'&&p.available?`<button class="p" onclick="S.modal={p:'${p.id}',q:1,a:[],obs:''};render()">Adicionar</button>`:''}</div></div>`).join('')}</div>`:'<p class="mut">Nenhum produto nesta categoria.</p>'}`}
function modal(){const M=S.modal,p=S.prods.find(x=>x.id==M.p),ad=(p.product_addons||[]).filter(a=>a.active),t=(Number(p.promo_price||p.price)+ad.filter(a=>M.a.includes(a.id)).reduce((s,a)=>s+Number(a.price),0))*M.q;
 return `<div class="modal" onclick="if(event.target==this){S.modal=null;render()}"><div><h2 style="margin-top:0">${p.name}</h2><div class="mut">${p.description||''}</div>${ad.length?'<h3>Adicionais</h3>':''}${ad.map(a=>`<label class="row"><span><input type="checkbox" style="width:auto;margin:0 8px 0 0" ${M.a.includes(a.id)?'checked':''} onchange="togA('${a.id}')">${a.name}</span><span>+ ${R(a.price)}</span></label>`).join('')}<textarea placeholder="Observação para a cozinha" oninput="S.modal.obs=this.value">${M.obs}</textarea><div class="row"><div><button class="g" onclick="S.modal.q=Math.max(1,S.modal.q-1);render()">−</button> <b style="margin:0 10px">${M.q}</b><button class="g" onclick="S.modal.q++;render()">+</button></div><button class="p" onclick="addC()">Adicionar ${R(t)}</button></div></div></div>`}
function togA(id){const a=S.modal.a;a.includes(id)?a.splice(a.indexOf(id),1):a.push(id);render()}
function addC(){const M=S.modal,p=S.prods.find(x=>x.id==M.p),ad=(p.product_addons||[]).filter(a=>M.a.includes(a.id));
 S.cart.push({pid:p.id,name:p.name,q:M.q,aid:M.a,an:ad.map(a=>a.name),obs:M.obs,u:Number(p.promo_price||p.price)+ad.reduce((s,a)=>s+Number(a.price),0)});S.modal=null;toast(p.name+' adicionado ao carrinho');render()}
function cart(){if(!S.cart.length)return '<div class="card"><h2>Seu carrinho está vazio</h2><p class="mut">Escolha um item no cardápio para começar.</p><button class="p" onclick="S.tab=\'menu\';render()">Ver cardápio</button></div>';
 return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card">${S.cart.map((i,k)=>`<div class="row"><div><b>${i.q}x ${i.name}</b><div class="mut">${esc(i.an.join(', '))} ${esc(i.obs)}</div></div><div>${R(i.u*i.q)} <button class="g" onclick="S.cart.splice(${k},1);render()">Remover</button></div></div>`).join('')}<div class="row pr"><span>Subtotal</span><span>${R(S.cart.reduce((s,i)=>s+i.u*i.q,0))}</span></div><div class="mut">Frete e desconto são calculados ao confirmar.</div></div>

 <div class="card"><h3 style="margin-top:0">Minhas preferências</h3><label>WhatsApp<input id="mp" inputmode="tel" value="${esc(S.me.phone)}"></label><label class="row" style="justify-content:flex-start;gap:8px"><input id="mw" type="checkbox" style="width:auto;margin:0" ${S.me.wa_opt_in?'checked':''}>Receber avisos do pedido por WhatsApp</label><button class="g" onclick="savePrefs()">Salvar</button></div></div>

function track(){const o=S.orders.find(x=>x.id==S.track);if(!o)return '<p class="mut">Pedido não encontrado.</p>';const i=ST.indexOf(o.status),L=['Pedido recebido','Pedido confirmado','Em preparação','Pedido pronto','Saiu para entrega','Pedido entregue'];

function el(o){const m=Math.floor((Date.now()-new Date(o.created_at))/60000),nx={novo:['confirmado','Confirmar'],confirmado:['preparo','Começar preparo'],preparo:['pronto','Marcar pronto']}[o.status];
 return `<div class="o" draggable="true" data-id="${o.id}"><b>#${o.number}</b> ${esc(o.customer_name)} <span class="mut">· ${m} min</span>${o.scheduled_for?`<span class="tg">⏰ ${fdt(o.scheduled_for)}</span>`:''}<div>${o.order_items.map(i=>i.qty+'x '+i.name).join(', ')}</div><div class="mut">${esc((o.address||{}).text)} · ${o.payment_method}${o.change_for?' (troco p/ '+R(o.change_for)+')':''}</div><div><b>${R(o.total)}</b> ${o.driver_id?'<span class="tg">🛵 designado</span>':''}</div>

 return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${[['Pedidos',d.length],['Em andamento',d.filter(o=>!['entregue','cancelado'].includes(o.status)).length],['Concluídos',fin.length],['Faturamento',R(rev)]].map(([a,b])=>`<div class="card"><span class="mut">${a}</span><div class="pr">${b}</div></div>`).join('')}</div><h2>Pedidos <span class="mut" style="font-size:14px">arraste entre as colunas</span></h2><div class="kan">${ST.map(s=>`<div class="col" data-s="${s}"><h3>${LB[s]} (${d.filter(o=>o.status==s).length})</h3>${d.filter(o=>o.status==s).map(el).join('')||'<div class="mut" style="padding:6px">Sem pedidos</div>'}</div>`).join('')}</div>`}

function drv(){const on=S.drv&&S.drv.status!='offline',mine=S.orders.filter(o=>o.driver_id==S.me.id&&['pronto','entrega'].includes(o.status)),off=S.orders.filter(o=>o.status=='pronto'&&!o.driver_id);

 ${S.earn?`<div class="card" style="margin-top:10px"><div class="row"><span>A receber</span><b>${R(S.earn.pending_amount)}</b></div><div class="mut">${S.earn.pending_count} entrega(s) · hoje ${S.earn.today_count} · já recebido ${R(S.earn.paid_amount)}</div></div>`:''}${mine.map(o=>`<div class="card" style="margin-top:10px;border-color:var(--ok)"><b>Entrega atual #${o.number}</b><div>${esc((o.address||{}).text)}</div><div class="mut">${R(o.total)} · ${o.payment_method}${o.change_for?' · troco p/ '+R(o.change_for):''}</div>${o.status=='pronto'?`<button class="p w" onclick="st('${o.id}','entrega')">Iniciar entrega</button>`:`<a href="https://www.google.com/maps/dir/?api=1&destination=${(o.address&&o.address.lat)?o.address.lat+','+o.address.lng:encodeURIComponent((o.address||{}).text||'')}" target="_blank" rel="noopener"><button class="g w">Iniciar navegação</button></a><button class="ok w" onclick="st('${o.id}','entregue')">Confirmar entrega</button>`}</div>`).join('')}

function clis(){if(!S.cli)return '<p class="mut">Carregando clientes…</p>';
 return `<h2 style="margin-top:0">Clientes</h2>${S.cli.length?`<div class="grid">${S.cli.map(c=>`<div class="card"><b>${esc(c.name)||'(sem nome)'}</b><div class="mut">${esc(c.phone)} · ${esc(c.email)}</div><div class="row"><span>${c.orders_count} pedido(s)</span><b>${R(c.spent)}</b></div><div class="mut">Ticket médio ${R(c.avg_ticket)} · último ${c.last_order?new Date(c.last_order).toLocaleDateString('pt-BR'):'—'}</div><button class="g" onclick="cliHist('${c.id}')">Histórico</button></div>`).join('')}</div>`:'<p class="mut">Nenhum cliente cadastrado ainda.</p>'}
 ${S.hist?`<h3>Histórico do cliente</h3><div class="card">${S.hist.list.map(o=>`<div class="row"><span>#${o.number} · ${new Date(o.created_at).toLocaleDateString('pt-BR')} · ${LB[o.status]}<div class="mut">${o.order_items.map(i=>i.qty+'x '+esc(i.name)).join(', ')}</div></span><b>${R(o.total)}</b></div>`).join('')||'<span class="mut">Sem pedidos.</span>'}</div>`:''}`}
async function loadPro(){const[c,p]=await Promise.all([sb.from('coupons').select('*').order('code'),sb.from('promotions').select('*').order('name')]);S.cps=c.data||[];S.prm=p.data||[];render()}
const num=id=>{const v=document.getElementById(id).value.replace(',','.').trim();return v===''?null:Number(v)};
async function addCp(){const code=document.getElementById('cc').value.trim().toUpperCase(),k=document.getElementById('ck').value,v=num('cv');if(!code)return toast('Informe o código.');if(k!='free_shipping'&&(v==null||isNaN(v)||v<=0))return toast('Informe o valor do desconto.');if(k=='percent'&&v>100)return toast('Percentual máximo é 100.');
 const d=document.getElementById('cd').value;const{error}=await sb.from('coupons').insert({code,kind:k,value:k=='free_shipping'?0:v,min_order:num('cm')||0,max_uses:num('cu'),valid_until:d?d+'T23:59:59-03:00':null});if(error)return toast(error.code=='23505'?'Já existe um cupom com esse código.':error.message);toast('Cupom criado');loadPro()}
async function addPm(){const n=document.getElementById('pn').value.trim(),v=num('pv');if(!n||v==null||isNaN(v)||v<=0||v>100)return toast('Informe nome e desconto entre 1 e 100%.');
 const days=document.getElementById('pd').value.split(',').map(x=>parseInt(x,10)).filter(x=>x>=0&&x<=6);const t=id=>document.getElementById(id).value||null;
 const{error}=await sb.from('promotions').insert({name:n,kind:document.getElementById('pk').value,value:v,days_of_week:days.length?days:null,start_time:t('ph1'),end_time:t('ph2'),min_qty:num('pq'),min_orders_customer:num('po')});if(error)return toast(error.message);toast('Promoção criada');loadPro()}
async function tgl(tb,id,v){const{error}=await sb.from(tb).update({active:v}).eq('id',id);if(error)return toast(error.message);loadPro()}
async function del(tb,id){if(!confirm('Excluir definitivamente?'))return;const{error}=await sb.from(tb).delete().eq('id',id);if(error)return toast(error.message);loadPro()}
function pro(){if(!S.cps)return '<p class="mut">Carregando…</p>';const DS=['dom','seg','ter','qua','qui','sex','sáb'];
 return `<h2 style="margin-top:0">Cupons</h2><div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><label>Código<input id="cc"></label><label>Tipo<select id="ck"><option value="percent">% de desconto</option><option value="fixed">Valor fixo (R$)</option><option value="free_shipping">Frete grátis</option></select></label><label>Valor<input id="cv" inputmode="decimal"></label><label>Pedido mínimo (R$)<input id="cm" inputmode="decimal"></label><label>Limite de usos<input id="cu" inputmode="numeric"></label><label>Validade<input id="cd" type="date"></label></div><button class="p" onclick="addCp()">Criar cupom</button></div>
 <div class="grid" style="margin-top:10px">${S.cps.map(c=>`<div class="card"><b>${esc(c.code)}</b> <span class="tg">${c.active?'Ativo':'Pausado'}</span><div class="mut">${({percent:c.value+'%',fixed:R(c.value),free_shipping:'Frete grátis'})[c.kind]} · mín. ${R(c.min_order||0)} · usos ${c.uses}${c.max_uses?'/'+c.max_uses:''}${c.valid_until?' · até '+new Date(c.valid_until).toLocaleDateString('pt-BR'):''}</div><div class="row"><button class="g" onclick="tgl('coupons','${c.id}',${!c.active})">${c.active?'Pausar':'Ativar'}</button><button class="g" onclick="del('coupons','${c.id}')">Excluir</button></div></div>`).join('')}</div>
 <h2>Promoções automáticas</h2><p class="mut">Aplicadas sozinhas no pedido, sem cupom. Vale a melhor promoção. A janela de horário deve ser no mesmo dia.</p><div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><label>Nome<input id="pn" placeholder="Happy hour"></label><label>Tipo<select id="pk"><option value="horario">Por horário</option><option value="quantidade">Por quantidade</option><option value="recorrente">Cliente recorrente</option></select></label><label>Desconto (%)<input id="pv" inputmode="decimal"></label><label>Dias (0=dom … 6=sáb)<input id="pd" placeholder="ex.: 4,5,6"></label><label>Das<input id="ph1" type="time"></label><label>Até<input id="ph2" type="time"></label><label>Qtd. mínima de itens<input id="pq" inputmode="numeric"></label><label>Pedidos já entregues (mín.)<input id="po" inputmode="numeric"></label></div><button class="p" onclick="addPm()">Criar promoção</button></div>
 <div class="grid" style="margin-top:10px">${S.prm.map(m=>`<div class="card"><b>${esc(m.name)}</b> <span class="tg">${m.active?'Ativa':'Pausada'}</span><div class="mut">${m.value}% · ${m.kind}${m.days_of_week?' · '+m.days_of_week.map(d=>DS[d]).join(','):''}${m.start_time?' · '+m.start_time.slice(0,5)+'–'+(m.end_time||'').slice(0,5):''}${m.min_qty?' · ≥'+m.min_qty+' itens':''}${m.min_orders_customer?' · ≥'+m.min_orders_customer+' pedidos':''}</div><div class="row"><button class="g" onclick="tgl('promotions','${m.id}',${!m.active})">${m.active?'Pausar':'Ativar'}</button><button class="g" onclick="del('promotions','${m.id}')">Excluir</button></div></div>`).join('')||'<p class="mut">Nenhuma promoção criada.</p>'}</div>`}
async function loadPay(){const{data}=await rpc('driver_balances');S.bal=data||[];render()}
async function payDrv(id,t){if(!confirm('Registrar pagamento de '+t+'?'))return;const{error}=await rpc('pay_driver',{p_driver:id});if(!error){toast('Pagamento registrado');loadPay()}}
async function saveCfg(){const f=num('sf'),la=num('sla'),ln=num('sln'),pe=num('spe'),pb=num('spb'),pv=num('spv');if([f,la,ln,pe,pb,pv].some(x=>x==null||isNaN(x)))return toast('Preencha números válidos.');
 const{error}=await sb.from('settings').upsert([{key:'driver_fee',value:f},{key:'restaurant_lat',value:la},{key:'restaurant_lng',value:ln},{key:'loyalty_earn',value:pe},{key:'loyalty_block',value:pb},{key:'loyalty_value',value:pv}]);if(error)return toast(error.message);await loadCfg();toast('Configurações salvas');render()}
function pay(){if(!S.bal)return '<p class="mut">Carregando…</p>';const a=S.me.role=='admin',c=S.cfg;
 return `<h2 style="margin-top:0">Repasse dos entregadores</h2><p class="mut">Valor por entrega: <b>${R(c.fee??5)}</b>. O valor fica registrado no momento em que cada entrega termina.</p><div class="grid">${S.bal.map(b=>`<div class="card"><b>${esc(b.name)||'Entregador'}</b><div class="mut">${esc(b.vehicle)}</div><div class="row"><span>A pagar</span><b>${R(b.pending_amount)}</b></div><div class="mut">${b.pending_count} entrega(s) · já pago ${R(b.paid_amount)}</div><button class="ok" ${b.pending_count?'':'disabled'} onclick="payDrv('${b.driver_id}','${R(b.pending_amount)}')">Registrar pagamento</button></div>`).join('')||'<p class="mut">Nenhum entregador cadastrado.</p>'}</div>
 ${a?`<h3>Configurações (admin)</h3><div class="card"><label>Valor por entrega (R$)<input id="sf" inputmode="decimal" value="${c.fee??5}"></label><label>Latitude do restaurante<input id="sla" value="${(c.rest||['',''])[0]}"></label><label>Longitude do restaurante<input id="sln" value="${(c.rest||['',''])[1]}"></label><h4 style="margin:12px 0 4px">Fidelidade</h4><label>Pontos por R$ 1<input id="spe" inputmode="decimal" value="${c.le??1}"></label><label>Pontos para cada resgate<input id="spb" inputmode="numeric" value="${c.lb??100}"></label><label>Valor do cupom por resgate (R$)<input id="spv" inputmode="decimal" value="${c.lv??5}"></label><button class="p" onclick="saveCfg()">Salvar</button></div>`:''}`}

/* ===== FASE 3 ===== */
async function loadMy(){const[a,b,c]=await Promise.all([sb.rpc('my_points'),sb.rpc('my_rewards'),sb.from('reviews').select('order_id,rating').eq('customer_id',S.me.id)]);S.pts=a.data;S.rw=b.data||[];S.revs={};(c.data||[]).forEach(r=>S.revs[r.order_id]=r.rating);render()}
async function redeem(){const{data,error}=await rpc('redeem_points',{p_blocks:1});if(!error){toast('Cupom '+data+' criado! Use no carrinho.');loadMy()}}
async function savePrefs(){const ph=$('#mp').value.trim().slice(0,20),wa=$('#mw').checked;const{error}=await sb.from('profiles').update({phone:ph,wa_opt_in:wa}).eq('id',S.me.id);if(error)return toast(error.message);S.me.phone=ph;S.me.wa_opt_in=wa;toast('Preferências salvas');render()}
function setRv(k,n){S.rv=S.rv||{};const t=$('#rc');if(t)S.rv.c=t.value;S.rv[k]=n;render()}
const stars=(k,v)=>[1,2,3,4,5].map(n=>`<button class="g" aria-label="${n} estrelas" onclick="setRv('${k}',${n})" style="padding:6px 10px;color:var(--gold)">${(v||0)>=n?'★':'☆'}</button>`).join('');
function revBox(o){const done=(S.revs||{})[o.id];if(done)return `<b>Pedido entregue. Obrigado pela avaliação!</b><div style="color:var(--gold);font-size:22px">${'★'.repeat(done)}${'☆'.repeat(5-done)}</div>`;
 const v=S.rv||{};return `<b>Pedido entregue. Como foi?</b><div class="mut" style="margin-top:8px">O pedido</div>${stars('r',v.r)}<div class="mut" style="margin-top:6px">O entregador (opcional)</div>${stars('d',v.d)}<textarea id="rc" maxlength="500" placeholder="Quer deixar um comentário?" style="margin-top:8px">${esc(v.c)}</textarea><button class="p" onclick="sendReview('${o.id}')">Enviar avaliação</button>`}
async function sendReview(id){const v=S.rv||{},c=$('#rc')?$('#rc').value.trim():'';if(!v.r)return toast('Escolha de 1 a 5 estrelas para o pedido.');
 const{error}=await sb.from('reviews').insert({order_id:id,customer_id:S.me.id,rating:v.r,driver_rating:v.d||null,comment:c||null});if(error)return toast(error.code=='23505'?'Este pedido já foi avaliado.':error.message);
 S.revs[id]=v.r;S.rv=null;toast('Obrigado pela avaliação!');render()}
function revSummary(){const l=S.rvs||[];if(!l.length)return '<span class="mut">Ainda não há avaliações.</span>';const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1).replace('.',','):'—';
 return `<div class="row"><span>Pedidos</span><b>★ ${avg(l.map(r=>r.rating))}</b></div><div class="row"><span>Entregadores</span><b>★ ${avg(l.filter(r=>r.driver_rating).map(r=>r.driver_rating))}</b></div>${l.filter(r=>r.comment).slice(0,5).map(r=>`<div class="mut" style="margin-top:8px">★${r.rating} · ${esc(r.comment)}</div>`).join('')}`}
const u8=b=>{const r=atob((b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
function pushBtn(){return (VAPID&&'PushManager' in window&&!S.push?'<button onclick="enablePush()">🔔 Avisos</button>':'')+(S.inst?'<button onclick="S.inst.prompt();S.inst=null;render()">📲 Instalar</button>':'')}
async function enablePush(){if(Notification.permission=='denied')return toast('Notificações bloqueadas. Libere nas configurações do navegador para este site.');
 try{if(await Notification.requestPermission()!='granted')return toast('Permissão negada.');const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)}),j=sub.toJSON();
  const{error}=await sb.from('push_subscriptions').upsert({user_id:S.me.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth},{onConflict:'endpoint'});
  if(error)return toast(error.message);S.push=true;toast('Avisos ativados neste aparelho');render()}catch(e){toast('Não foi possível ativar os avisos neste aparelho.')}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.me)render()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(async r=>{try{const sub=r.pushManager&&await r.pushManager.getSubscription();S.push=!!sub&&Notification.permission=='granted';if(S.me)render()}catch(e){}}).catch(()=>{}));
</script></body></html>
